name: Docs

on:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  build:
    name: Build API docs (pdoc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install --sync
      - run: make docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dev-reports/docs

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: [build]
    # This job never checks out the repo, so there is no `persist-credentials`
    # to disable here: it deploys the artifact uploaded by `build` and
    # authenticates purely via the Pages OIDC token (`id-token: write` below),
    # not a persisted git credential.
    permissions:
      pages: write # required to deploy to GitHub Pages
      id-token: write # required for Pages OIDC verification
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
